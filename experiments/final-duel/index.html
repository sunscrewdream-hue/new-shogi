<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新選組将棋｜最後の一発・独立テスト</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic",sans-serif}*{box-sizing:border-box}
body{background:#101b25;color:#f6e7c7;margin:0;padding:16px}main{max-width:640px;margin:auto}
h1{font:900 clamp(24px,5vw,38px) serif;margin:8px 0}p{line-height:1.6}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{font:700 15px system-ui;padding:10px;border-radius:7px;color:#fff0d0;background:#29445a;border:1px solid #bda169;cursor:pointer}
button:disabled{opacity:.45}#board{display:grid;aspect-ratio:1;gap:3px;background:#58432d;padding:5px;border:3px solid #c5a775;max-width:580px;margin:auto}
.sq{position:relative;width:100%;aspect-ratio:1;border:1px solid #aa946e;border-radius:2px;padding:0;display:grid;place-items:center;background:#e2cfab;color:#201710;font-size:clamp(15px,3vw,30px)}
.sq.dark{background:#d3b88e}.sq.gun{background:#efcd70}.sq.king0{color:#164566}.sq.king1{color:#9a2430}
.sq .gun-icon{position:absolute;right:0;top:0;font-size:.6em}.sq:disabled{opacity:1;cursor:default}
#status{font-weight:800;font-size:20px;min-height:3em;margin:10px 0}#log{white-space:pre-wrap;background:#0b111c;padding:10px;border-radius:8px;min-height:90px;font-size:13px}
#shot{display:none;position:fixed;inset:0;z-index:10;place-items:center;background:#000b;text-align:center;font-size:clamp(28px,8vw,70px);font-weight:900;color:#ffe0a2;text-shadow:0 0 20px #f80}
#shot.show{display:grid}small{color:#c2c7cc}
</style></head><body><main><h1>最後の一発 <small>検証版</small></h1>
<p>王将だけになった局面で、双方から合法手で到達できるマスに拳銃が出現。王将が拾うと決着します。<strong>このページは本編から完全に独立した試作です。</strong></p>
<div class="controls"><label>盤面 <select id="size"><option value="9,9">通常 9×9</option><option value="5,6">物語 5×6</option></select></label>
<label>対局 <select id="mode"><option value="local">二人対戦</option><option value="ai">対CPU</option></select></label>
<button id="restart">新しい決闘</button><button id="tests">検査を実行</button></div>
<div id="status" role="status"></div><div id="board" aria-label="決闘の盤面"></div>
<h2>ログ</h2><pre id="log"></pre>
<p><small>これは拳銃出現位置と勝敗処理の試作品です。拳銃アイコンは仮置きで、正式なS&amp;W No.2 Army画像は未組み込み。音声・演出も後で接続します。盤上が王将2枚だけの初期状態を模擬しています。</small></p>
</main><div id="shot" role="alert"><div>これで仕舞いだ！<div>💥</div></div></div>
<script src="final-duel.js"></script>
<script>
(()=>{
'use strict';
const rule=window.ShinsengumiFinalDuel,board=document.getElementById('board'),status=document.getElementById('status'),log=document.getElementById('log'),shot=document.getElementById('shot');
let state,duel,running=false;
function msg(text){log.textContent=text+'\n'+log.textContent.slice(0,1000);}
function reset(){
 const [rows,cols]=document.getElementById('size').value.split(',').map(Number);
 state={rows,cols,turn:0,kings:[{y:rows-1,x:0},{y:0,x:cols-1}],onlyKings:true,handsEmpty:true,enabled:true,ended:false};
 duel=rule.begin(state);running=false;shot.classList.remove('show');log.textContent='';
 msg('王将のみの局面。拳銃が配置されました。');draw();
}
function draw(){
 board.style.gridTemplateColumns='repeat('+state.cols+',1fr)';board.style.aspectRatio=state.cols+'/'+state.rows;board.replaceChildren();
 status.textContent=duel.winner!==null?((duel.winner===0?'新選組':'相手方')+'の勝利！'):((state.turn===0?'新選組':'相手方')+'の手番：拳銃を拾え！');
 for(let y=0;y<state.rows;y++)for(let x=0;x<state.cols;x++){
  const p={y,x},at=state.kings.findIndex(k=>k.y===y&&k.x===x),gun=duel.gun?.y===y&&duel.gun?.x===x;
  const el=document.createElement('button');el.className='sq'+((x+y)%2?' dark':'')+(gun?' gun':'')+(at>=0?' king'+at:'');
  el.textContent=at===0?'王':at===1?'玉':'';
  if(gun){const icon=document.createElement('span');icon.className='gun-icon';icon.textContent='🔫';el.append(icon)}
  el.setAttribute('aria-label',y+'段'+x+'列'+(at>=0?'王将':'')+(gun?'拳銃':''));
  el.disabled=!rule.legalKingMove(state,state.turn,p)||duel.winner!==null||running;
  el.onclick=()=>play(p);board.append(el);
 }
}
function play(p){
 const result=rule.move(state,duel,state.turn,p);if(!result)return;
 state=result.state;duel=result.duel;
 if(result.event==='shot'){
  msg('拳銃取得。勝者：'+(duel.winner===0?'新選組':'相手方'));
  shot.classList.add('show');setTimeout(()=>shot.classList.remove('show'),1800);
 }else if(result.event==='relocate')msg('4手経過：拳銃を再配置');
 draw();
 if(document.getElementById('mode').value==='ai'&&state.turn===1&&duel.winner===null){
  running=true;setTimeout(()=>{running=false;if(duel.winner!==null)return;const d=rule.distances(duel.gun,state.kings[0],state);
   const opts=[];for(let y=0;y<state.rows;y++)for(let x=0;x<state.cols;x++)if(rule.legalKingMove(state,1,{y,x}))opts.push({y,x});
   opts.sort((a,b)=>(d.get(a.y+','+a.x)??999)-(d.get(b.y+','+b.x)??999));if(opts.length)play(opts[0]);},350);
 }
}
function test(){
 let errors=[],count=0;
 for(const [rows,cols] of [[9,9],[5,6]])for(let y0=0;y0<rows;y0++)for(let x0=0;x0<cols;x0++)for(let y1=0;y1<rows;y1++)for(let x1=0;x1<cols;x1++)for(const turn of [0,1]){
  const s={rows,cols,kings:[{y:y0,x:x0},{y:y1,x:x1}],turn,onlyKings:true,handsEmpty:true,enabled:true,ended:false};
  if(!rule.validState(s))continue;
  const gun=rule.chooseSquare(s,()=>0.42);count++;
  if(gun){const a=rule.distances(s.kings[0],s.kings[1],s),b=rule.distances(s.kings[1],s.kings[0],s),k=gun.y+','+gun.x;
    if(!a.has(k)||!b.has(k)||a.get(k)<2||b.get(k)<2)errors.push('illegal gun: '+JSON.stringify(s));
  }
 }
 msg('位置検査 '+count+' 局面：'+(errors.length?'失敗 '+errors.length:'全件通過')+(errors[0]?'\n'+errors[0]:''));
}
document.getElementById('restart').onclick=reset;document.getElementById('size').onchange=reset;document.getElementById('mode').onchange=reset;document.getElementById('tests').onclick=test;reset();
})();
</script></body></html>
