name: Verify game changes
on:
  push:
  pull_request:
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent rejected or temporary file inclusion
        run: node scripts/check-repository-hygiene.cjs
      - name: Verify shared game rules, assets and events
        run: node --test tests/*.test.cjs
