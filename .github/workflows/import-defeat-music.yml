name: Import approved defeat music
on:
  push:
    branches:
      - release/preview-20261108
    paths:
      - .github/workflows/import-defeat-music.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original approved music without modification
        shell: bash
        env:
          SOURCE_AUDIO: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-2ca4-81fa-8758-93bc3481dc5d/raw?se=2026-11-12T02%3A33%3A24Z&sp=r&sv=2026-06-06&sr=b&scid=0bc98848-74a0-5a84-8364-338af917c4c2&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T00%3A54%3A01Z&ske=2026-11-13T00%3A54%3A01Z&sks=b&skv=2026-06-06&sig=a99PJXLIco0jhOpqrghHC0h63EusFTS5ph%2BSqahwQuk%3D'
        run: |
          set -euo pipefail
          mkdir -p assets/audio/bgm
          curl --fail --location --retry 3 --max-time 120 --silent --show-error "$SOURCE_AUDIO" --output assets/audio/bgm/defeat_full.mp3
          echo '8d79ff181fa4e2c62d17be695ea3112f9b8627007f25062b231f553e13406314  assets/audio/bgm/defeat_full.mp3' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/bgm/defeat_full.mp3
          git commit -m 'Add full-length defeat BGM audio asset' || exit 0
          git push origin HEAD:release/preview-20261108
