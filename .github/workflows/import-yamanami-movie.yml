name: Import approved cinematic highlight
on:
  push:
    branches:
      - release/preview-20261108
    paths:
      - .github/workflows/import-yamanami-movie.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install required video tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare playable MP4 and thumbnail
        shell: bash
        env:
          MOV_SOURCE: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-8a28-81fa-a84a-d498716f5474/raw?se=2026-11-12T05%3A46%3A06Z&sp=r&sv=2026-06-06&sr=b&scid=bdf1560b-b4f7-5853-a3c1-97c5626680b8&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T01%3A11%3A55Z&ske=2026-11-13T01%3A11%3A55Z&sks=b&skv=2026-06-06&sig=GULtCjU0v/0S8rIPcpX3OituWEmDxdGjSlpkBYZJMQI%3D'
        run: |
          set -euo pipefail
          mkdir -p assets/movies
          curl --fail --location --retry 3 --max-time 220 --silent --show-error "$MOV_SOURCE" --output /tmp/yamanami.mov
          echo '29f1a20f74bee7ce7ed0e344d5599346aa6c6ff4d6f69075a9653d5888f29f7b  /tmp/yamanami.mov' | sha256sum --check
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/yamanami.mov -map 0:v:0 -map 0:a:0 -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -r 24 -c:a aac -b:a 128k -movflags +faststart assets/movies/yamanami-final-1865.mp4
          ffmpeg -nostdin -y -hide_banner -loglevel error -ss 11.6 -i /tmp/yamanami.mov -frames:v 1 -vf scale=1280:720 -c:v libwebp -quality 84 assets/movies/yamanami-final-1865-poster.webp
          test "$(stat -c%s assets/movies/yamanami-final-1865.mp4)" -gt 1000000
          test "$(stat -c%s assets/movies/yamanami-final-1865-poster.webp)" -gt 10000
          ffprobe -v error -show_entries format=duration,size -of compact assets/movies/yamanami-final-1865.mp4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/movies/yamanami-final-1865.mp4 assets/movies/yamanami-final-1865-poster.webp
          git commit -m 'Publish Yamanami cinematic highlight film and poster' || exit 0
          git push origin HEAD:release/preview-20261108
