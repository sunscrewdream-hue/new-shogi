<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#030405">
 <title>新選組将棋｜エンドロール試写</title>
 <link rel="stylesheet" href="end-credits.css">
 <style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10171c;color:#f6e8ca}
  body{font-family:system-ui,"Yu Gothic",sans-serif;display:grid;min-height:100dvh;place-items:center;padding:24px}
  .preview-gate{width:min(100%,620px);text-align:center;padding:clamp(28px,7vw,58px);border:1px solid #b8955570;border-radius:14px;background:linear-gradient(145deg,#1d2c36,#11191f);box-shadow:0 20px 60px #0008}
  .preview-gate img{width:min(72vw,380px);height:auto;max-height:130px;object-fit:contain;margin-bottom:20px}
  .preview-gate h1{font:600 clamp(22px,5vw,32px)/1.4 "Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.12em;margin:0 0 10px}
  .preview-gate p{color:#c8c3b7;line-height:1.8;font-size:14px}
  .preview-options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0}
  .preview-options label{border:1px solid #b8955570;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .preview-options input{accent-color:#d4ae6a;margin-right:6px}
  #previewStart{border:1px solid #e3cb98;border-radius:999px;background:linear-gradient(#dec18a,#a87540);color:#21190e;padding:13px 24px;font-weight:700;font-size:15px;cursor:pointer}
  #previewStart:focus-visible{outline:3px solid #fff;outline-offset:3px}
  @media(max-width:520px){.preview-options{flex-direction:column}.preview-options label{text-align:left}}
 </style>
 <script defer src="endroll.js"></script>
</head>
<body>
 <main class="preview-gate" id="previewGate">
  <img src="assets/logo-shinsengumi-sumi-watercolor.webp" alt="新選組将棋">
  <h1>エンドロール試写</h1>
  <p>再生を押すと、ロゴ・出演者・楽曲クレジット・最後の「製作・著作 Mabii」まで確認できます。<br>音楽が流れます。</p>
  <fieldset class="preview-options" aria-label="再生時間">
   <label><input type="radio" name="previewDuration" value="45" checked>短縮プレビュー（約1分）</label>
   <label><input type="radio" name="previewDuration" value="260">本番尺（約4分40秒）</label>
  </fieldset>
  <button id="previewStart" type="button">エンドロールを再生</button>
 </main>
</body>
</html>
