<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14242d"><title>幕末物語｜新選組将棋</title><link rel="stylesheet" href="story-mode.css?v=artclear20261105a"></head>
<body>
<main id="storyApp">
 <header class="story-header"><a class="back-link" href="card-ai-test.html">‹ 通常対局へ</a><img class="story-header-logo" src="logo-shinsengumi-gold-crossed-swords.webp" alt="新選組将棋" width="2172" height="724" decoding="async"><button id="audioToggle" type="button" aria-pressed="true">♪ 音 ON</button></header>
 <section id="storyHome" class="view">
  <div class="story-hero"><div class="story-tag">誠の軌跡</div><h1>幕末物語</h1><p>志を胸に、時代を駆ける。<br>史実をたどりながら、盤上で新選組を指揮せよ。</p></div>
  <div class="story-dev-controls"><button id="storyDevToggle" type="button" aria-pressed="false">🛠 開発テスト：全章を表示</button><p id="storyDevNote" class="story-dev-note" hidden>テスト中：全章・終章に直接移動できます。クリア・人物獲得は保存しません。</p></div>
  <div id="storyChapters" class="chapter-grid"></div>
  <p class="history-note">史実に基づく物語ですが、対局・勝敗・駒の配置はゲーム独自の演出です。</p>
 </section>
 <section id="storyDialogue" class="view hidden" aria-live="polite">
  <div class="scene-art" id="dialogueScene"><div class="scene-overlay"><span id="dialogueDate"></span><h2 id="dialogueTitle"></h2></div></div>
  <div class="narration"><div class="narrator-label" id="dialogueSpeaker"></div><p id="dialogueBody"></p><div class="dialogue-foot"><span id="dialogueCount"></span><button id="dialogueNext">続ける ›</button></div></div>
 </section>
 <section id="storyBattle" class="view hidden" aria-label="物語の対局">
  <div class="battle-top"><span id="battleChapter"></span><button id="battleQuit">章選択へ</button></div>
  <h2 id="battleTitle"></h2>
  <div id="enemyStoryBanner" class="person-banner"><img id="enemyStoryArt" src="" alt=""><div class="banner-text"><div id="enemyStoryName" class="banner-name"></div><div id="enemyStoryRole" class="banner-role"></div></div></div>
  <div class="hand-container"><span>敵軍の持ち駒</span><div id="storyHand1" class="story-hand"></div></div>
  <div id="storyStatus" class="battle-status" aria-live="polite"></div>
  <div id="storyBoard" role="grid" aria-label="将棋盤"></div>
  <div class="hand-container"><span>新選組の持ち駒（タップで駒打ち）</span><div id="storyHand0" class="story-hand"></div></div>
  <div id="playerStoryBanner" class="person-banner"><img id="playerStoryArt" src="" alt=""><div class="banner-text"><div id="playerStoryName" class="banner-name"></div><div id="playerStoryRole" class="banner-role"></div></div></div>
  <div class="battle-bottom"><button id="storyRules">操作・ルール</button><button id="storyResign">降参する</button></div>
 </section>
 <div id="storyPopup" class="popup hidden" role="dialog" aria-modal="true" aria-live="polite"><div class="popup-panel"><img id="popupArt" alt="" class="popup-art hidden"><h2 id="popupTitle"></h2><p id="popupText"></p><div id="popupButtons" class="popup-buttons"></div></div></div>
</main>
<script src="story-bgm.js?v=bgm20261105a" defer></script>
<script src="story-data.js?v=story3" defer></script><script src="story-engine.js?v=story3" defer></script><script src="story-weapons.js?v=bgm20261105a" defer></script><script src="story-mode.js?v=artclear20261105a" defer></script>
</body></html>
