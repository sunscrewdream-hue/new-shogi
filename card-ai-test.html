/* 四季の京都：既に淡い原画をそのまま活かし、UIだけ局所的に透過処理 */
:root{--kyoto-season-art:url("kyoto-autumn.webp")}
html{min-height:100%;background:#e8e0d3}
body{min-height:100dvh;position:relative;isolation:isolate;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--kyoto-season-art,none);background-position:center center;background-size:cover;background-repeat:no-repeat}
/* 京都石畳の正式採用盤。画像内の9×9罫線とタップ領域を一致させる。 */
#board{
 border:0;
 outline:0;
 padding:min(2.9vw,15.4px);
 background-color:#aaa49c;
 background-image:url("board-kyoto-anime-framed-1080.webp"),url("assets/board-kyoto-stone.svg");
 background-repeat:no-repeat;
 background-position:center center;
 background-size:100% 100%;
 box-shadow:0 14px 32px rgba(42,43,39,.30);
}
#board .sq{
 border:0;

 background:transparent;
}
#board .sq span{

 font-weight:900;
 text-shadow:0 1px 1px rgba(255,254,240,.92),0 0 4px rgba(250,248,235,.40);
}

#status,#cardCountdown,#event{max-width:520px;box-sizing:border-box;margin:6px auto;padding:6px 9px;border-radius:6px;background:rgba(250,245,235,.42);text-shadow:0 1px 1px rgba(255,255,255,.65);box-shadow:0 2px 12px rgba(55,40,28,.06)}

/* 18 separate assets: four full-figure portraits and 14 centered calligraphy glyphs. */
#board .sq{position:relative;overflow:hidden;isolation:isolate}
#board .sq .piece-layer{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* Earthquake choreography: each source flashes red and slides visibly to its destination. */
@keyframes quakeRedFlash{
  0%,100%{background:rgba(255,42,44,.83);outline:3px solid #ff1738;box-shadow:inset 0 0 0 2px #fff8ef,0 0 15px 4px #ff173c}
  50%{background:rgba(165,0,17,.13);outline:3px solid #ff7280;box-shadow:inset 0 0 0 1px #ff3140,0 0 6px 2px #fb3446}
}
#board .sq.quake-mark{
  background:rgba(255,41,49,.5)!important;
  outline:3px solid #ed1530!important;
  animation:quakeRedFlash .24s steps(2,end) infinite!important;
  z-index:7;
}
#board .sq.quake-origin{overflow:visible!important;z-index:10}
#board .sq.quake-mark .piece-letter{filter:drop-shadow(0 0 4px #ff3243) drop-shadow(0 0 4px #fff)}
@keyframes quakeTravel{
  0%,15%{transform:translate(0,0)}
  100%{transform:translate(var(--quake-dx),var(--quake-dy))}
}
@keyframes quakeTravelEnemy{
  0%,15%{transform:rotate(180deg) translate(0,0)}
  100%{transform:translate(var(--quake-dx),var(--quake-dy)) rotate(180deg)}
}
#board .sq.quake-origin .piece-layer{animation:quakeTravel .46s ease-in-out both}
#board .sq.quake-origin .piece-letter.enemy{animation-name:quakeTravelEnemy}
@keyframes quakeArrive{0%{transform:scale(1.22)}100%{transform:scale(1)}}
#board .sq.quake-landing .piece-figure{animation:quakeArrive .36s ease-out both}
@media(prefers-reduced-motion:reduce){
  #board .sq.quake-origin .piece-layer{animation:none}
  #board .sq.quake-mark{animation:quakeRedFlash .6s steps(2,end) infinite!important}
}

/* Check indicator derives attackers from the same legal attack graph as shogi rules. */
function getCheckThreats(B=b){
 const kings=new Set(),attackers=new Set(),rays=new Set();
 for(let side=0;side<2;side++){
  if(!check(B,side))continue;
  let king=null;
  for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(B[y][x]?.s===side&&B[y][x].t==='玉')king={y,x};
  if(!king)continue;
  kings.add(king.y+','+king.x);
  for(let y=0;y<9;y++)for(let x=0;x<9;x++){
   const p=B[y][x];
   if(!p||p.s===side||!moves(B,y,x,true).some(([yy,xx])=>yy===king.y&&xx===king.x))continue;
   attackers.add(y+','+x);
   const dy=king.y-y,dx=king.x-x;
   const rookRay=p.t==='飛'&&(dy===0||dx===0);
   const bishopRay=p.t==='角'&&Math.abs(dy)===Math.abs(dx);
   const lanceRay=p.t==='香'&&dx===0;
   if((rookRay||bishopRay||lanceRay)&&Math.max(Math.abs(dy),Math.abs(dx))>1){
    const stepY=Math.sign(dy),stepX=Math.sign(dx),steps=Math.max(Math.abs(dy),Math.abs(dx));
    for(let k=1;k<steps;k++)rays.add((y+k*stepY)+','+(x+k*stepX));
   }
  }
 }
 return {kings,attackers,rays};
}
