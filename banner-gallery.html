<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクターバナー40名確認｜新選組将棋</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c27;color:#eee1c6;font:14px/1.65 system-ui,'Yu Gothic',sans-serif}main{width:min(1000px,calc(100% - 20px));margin:22px auto 60px}h1{color:#ebcf95;font:800 clamp(21px,5vw,33px) serif;margin:0 0 10px}p{color:#b4c2c5}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools button{border:1px solid #9b7955;background:#21333c;color:#f3e0bd;padding:7px 12px;border-radius:5px;font:700 13px sans-serif}.tools button.active{background:#c5a46d;color:#12202a}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:12px}.item{margin:0;padding:7px;background:#1c2d35;border:1px solid #685b4c;border-radius:7px}.banner{position:relative;aspect-ratio:880/174;width:100%;overflow:hidden;background:#e3cfab}.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.copy{position:absolute;z-index:1;inset:10% auto 9% 4%;width:53%;display:flex;flex-direction:column;justify-content:center;color:#192c31}.name{font:900 clamp(18px,4.5vw,29px)/1.1 'Yu Mincho',serif;letter-spacing:.04em;white-space:nowrap}.meta{display:flex;gap:5px;align-items:center;margin-top:2px;font:800 clamp(10px,2.3vw,14px)/1.2 'Yu Mincho',serif;white-space:nowrap}.role{display:inline-flex;align-items:center;gap:4px}.role::before,.role::after{content:"";width:clamp(8px,1.8vw,14px);border-top:1px solid #795634}.piece{border:1px solid #92714b;padding:1px 4px;border-radius:3px;background:#f0dfb6a8}.item figcaption{display:flex;justify-content:space-between;color:#aec0c5;font-size:11px;padding:3px 3px 0}.item[data-side="1"] figcaption{color:#d6aaaa}a{color:#9ed5df}@media(max-width:430px){.name{font-size:clamp(18px,5.5vw,24px)}.meta{font-size:11px}}
</style></head><body><main><h1>人物バナー40名・確認一覧</h1><p>採用済みコレクションカードから顔を抜き出した、ゲーム用880×174素材です。名前・所属／役職・駒名は画像に含めず、表示時に重ねています。</p><div class="tools"><button type="button" class="active" data-side="all">すべて</button><button type="button" data-side="0">新選組20名</button><button type="button" data-side="1">薩長20名</button></div><div class="list" id="list"></div><p><a href="banner-prototype.html">近藤勇の文字差し替え試作へ</a>　／　<a href="card-ai-test.html">対局へ戻る</a></p></main>
<script>
const clans=['薩摩藩','薩摩藩','長州藩','薩摩藩','長州藩','薩摩藩','長州藩','薩摩藩','長州藩','薩摩藩','薩摩藩','薩摩藩','薩摩藩','薩摩藩','薩摩藩','長州藩','長州藩','長州藩','長州藩','長州藩'];
function show(side){for(const f of document.querySelectorAll('.item'))f.hidden=side!=='all'&&f.dataset.side!==side;for(const b of document.querySelectorAll('.tools button'))b.classList.toggle('active',b.dataset.side===side)}
for(const b of document.querySelectorAll('.tools button'))b.addEventListener('click',()=>show(b.dataset.side));
fetch('collection.html').then(r=>r.text()).then(html=>{
 const doc=new DOMParser().parseFromString(html,'text/html');const source=[...doc.querySelectorAll('.card')];const list=document.getElementById('list');
 source.forEach((card,i)=>{const id=i+1,side=i<20?'0':'1',name=card.querySelector('summary h3').textContent,role=side==='0'?card.querySelector('.role').textContent:clans[i-20];const fig=document.createElement('figure');fig.className='item';fig.dataset.side=side;
 const frame=document.createElement('div');frame.className='banner';const img=new Image();img.src='assets/dialogue_banners/person_'+String(id).padStart(2,'0')+'.webp?v=face-balance-20261107d';img.loading='lazy';img.alt='';frame.append(img);
 const copy=document.createElement('div');copy.className='copy';const n=document.createElement('div');n.className='name';n.textContent=name;const meta=document.createElement('div');meta.className='meta';const r=document.createElement('span');r.className='role';r.textContent=role;const p=document.createElement('span');p.className='piece';p.textContent=id===1||id===21?'玉':'駒';meta.append(r,p);copy.append(n,meta);frame.append(copy);
 const cap=document.createElement('figcaption');const left=document.createElement('span');left.textContent=String(id).padStart(2,'0')+'　'+name;const right=document.createElement('span');right.textContent=side==='0'?'新選組':'薩長';cap.append(left,right);fig.append(frame,cap);list.append(fig)});
}).catch(()=>{document.getElementById('list').textContent='一覧を読み込めませんでした。'});
</script></body></html>
